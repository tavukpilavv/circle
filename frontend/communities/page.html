<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CirCle • Communities</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <link rel="stylesheet" href="communities.css" />
</head>

<body>
  <!-- Top strip -->
  <div class="top-bar"></div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-inner">
      <div class="nav-left">
        <a href="index.html" class="logo">CirCle</a>

        <nav class="tabs" aria-label="Primary navigation">
          <a href="communities.html" class="tab is-active">Communities</a>
          <a href="events.html" class="tab">Events</a>
        </nav>
      </div>

      <div class="nav-center">
        <form class="global-search" role="search" aria-label="Search for an Event">
          <input type="search" placeholder="Search for an Event" aria-label="Search for an Event" />
        </form>
      </div>

      <div class="nav-right">
        <button class="icon-btn" aria-label="Account">
          <i class="fas fa-user"></i>
        </button>
      </div>
    </div>
  </header>

  <div class="nav-bottom-line"></div>

  <main class="page-wrap">
    <!-- Intro -->
    <section class="intro">
      <p class="intro-text">Connect with communities and explore new groups</p>

      <!-- Search Communities -->
      <div class="community-search-shell">
        <i class="fas fa-search" aria-hidden="true"></i>
        <input id="communitySearchInput" type="search" placeholder="Search communities..." aria-label="Search communities" />
      </div>

      <!-- Filters + Add button -->
      <div class="filters-row">
        <div class="filters-label-space"></div>

        <div class="filters-pills">
          <button class="filter-pill is-active" type="button" data-filter="all">All</button>
          <button class="filter-pill" type="button" data-filter="hasWebsite">Has Website</button>
          <button class="filter-pill primary" type="button" data-filter="noWebsite">No Website</button>

          <!-- Only shown if admin/super_admin -->
          <button id="openCreateBtn" class="add-btn" type="button">
            + Add Community
          </button>
        </div>
      </div>
    </section>

    <!-- Communities list -->
    <section class="community-list" id="communityList">
      <!-- populated by JS -->
    </section>

    <!-- Create Modal -->
    <div id="modalOverlay" class="modal-overlay" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button id="closeModalBtn" class="modal-close" aria-label="Close">
          <span>&times;</span>
        </button>

        <h2 id="modalTitle" class="modal-title">Create Community</h2>

        <form id="createCommunityForm" class="modal-form">
          <div class="form-field">
            <label for="cName">Community Name</label>
            <input id="cName" name="name" type="text" required />
          </div>

          <div class="form-field">
            <label for="cDesc">Description</label>
            <textarea id="cDesc" name="description" rows="3" required></textarea>
          </div>

          <div class="form-field">
            <label for="cWebsite">Website URL</label>
            <input id="cWebsite" name="website_url" type="url" placeholder="https://example.com" required />
          </div>

          <div class="form-field">
            <label for="cMembers">Members Count (optional)</label>
            <input id="cMembers" name="members_count" type="number" min="0" value="0" />
          </div>

          <div class="form-field">
            <label for="cImage">Community Image</label>
            <input id="cImage" name="image" type="file" accept="image/*" required />
            <small id="fileHint" class="hint"></small>
          </div>

          <button id="submitBtn" class="modal-submit" type="submit">
            Create
          </button>

          <p id="formMsg" class="form-msg" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </main>

  <script src="communities.js"></script>
</body>
</html>
